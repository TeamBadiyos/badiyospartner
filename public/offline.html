<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>No internet · badiyos Partner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0074E4" />
    <style>
      :root { --brand: #0074E4; --brand-dark: #0058B0; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem 1.5rem calc(env(safe-area-inset-bottom) + 2rem);
        font-family: "Nunito Sans", system-ui, -apple-system, sans-serif;
        background: linear-gradient(180deg, var(--brand-dark), var(--brand));
        color: #fff;
        text-align: center;
        -webkit-user-select: none;
        user-select: none;
      }
      .card { max-width: 22rem; width: 100%; }
      .icon {
        width: 84px; height: 84px; margin: 0 auto 1.5rem;
        border-radius: 50%; display: grid; place-items: center;
        background: rgba(255, 255, 255, 0.14);
      }
      h1 { font-size: 1.375rem; font-weight: 800; margin: 0 0 0.5rem; }
      p { margin: 0 0 2rem; font-size: 0.95rem; line-height: 1.5; color: rgba(255, 255, 255, 0.85); }
      button {
        width: 100%; height: 52px; border: 0; border-radius: 14px;
        background: #fff; color: var(--brand);
        font: 700 1rem "Nunito Sans", system-ui, sans-serif; cursor: pointer;
      }
      button:active { transform: scale(0.98); }
      .status { margin-top: 1rem; font-size: 0.8125rem; color: rgba(255, 255, 255, 0.75); min-height: 1.25rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 2l20 20" />
          <path d="M8.5 16.5a5 5 0 0 1 7 0" />
          <path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
          <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" />
          <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68" />
          <path d="M5 12.55a10 10 0 0 1 5.17-2.39" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>
      <h1>No internet connection</h1>
      <p>badiyos Partner needs an internet connection. Check your mobile data or Wi-Fi and try again.</p>
      <button type="button" id="retry">Try again</button>
      <div class="status" id="status"></div>
    </div>
    <script>
      var APP_URL = "https://partner.badiyos.com";
      var statusEl = document.getElementById("status");

      function goBackOnline() {
        statusEl.textContent = "Back online — reconnecting…";
        location.replace(APP_URL);
      }

      function probe() {
        if (!navigator.onLine) return Promise.resolve(false);
        return fetch(APP_URL + "/favicon.png?ts=" + Date.now(), { method: "GET", cache: "no-store" })
          .then(function () { return true; })
          .catch(function () { return false; });
      }

      function attempt(manual) {
        if (manual) statusEl.textContent = "Checking connection…";
        return probe().then(function (ok) {
          if (ok) goBackOnline();
          else if (manual) statusEl.textContent = "Still offline. Please try again.";
          return ok;
        });
      }

      document.getElementById("retry").addEventListener("click", function () { attempt(true); });
      window.addEventListener("online", function () { attempt(false); });
      setInterval(function () { attempt(false); }, 5000);
    </script>
  </body>
</html>
